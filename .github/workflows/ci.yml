# CI das PRs: roda nos runners do GitHub (repositório público), nunca na VM
name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      # o runner já traz o Chrome; --watch=false encerra após uma execução
      - run: yarn test --watch=false --browsers=ChromeHeadless --no-progress
