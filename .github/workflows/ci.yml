# CI das PRs: roda nos runners do GitHub (repositório público), nunca na VM
name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      # environment.ts e .development.ts são ignorados no git (locais do dev); o CI usa valores fictícios. O de produção é versionado (T23)
      - name: Gera environments de CI
        run: |
          mkdir -p src/environments
          for f in environment environment.development; do
            printf "export const environment = { production: false, baseUrl: 'http://localhost', registry_port: '1000', control_port: '1010', juristic_port: '1030', operations_port: '1020' };\n" > "src/environments/$f.ts"
          done
      - run: yarn build
      # o runner já traz o Chrome; --watch=false encerra após uma execução
      - run: yarn test --watch=false --browsers=ChromeHeadless --no-progress
