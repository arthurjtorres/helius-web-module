<mat-toolbar class="mat-elevation-z3">
  <button mat-icon-button (click)="collapsed.set(!collapsed())">
    <mat-icon>menu</mat-icon>
  </button>

  <span>Sistema Helius</span>

  <span class="spacer"></span>

  @if (user$ | async; as user) {
    <div class="user-info">
      <span class="user-name"
        >Olá, <b>{{ user.userName }}</b></span
      >

      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
      </button>

      <mat-menu #userMenu="matMenu" class="user-menu-panel">
        <div class="menu-header">
          <p>{{ user.email }}</p>
          <small>{{ user.userType }}</small>
        </div>

        <mat-divider></mat-divider>
        <button mat-menu-item>
          <mat-icon class="menu-icons-custom">settings</mat-icon>
          <span class="menu-items-custom">Configuração</span>
        </button>

        <button
          mat-menu-item
          (click)="$event.stopPropagation()"
          class="dark-mode-item"
        >
          <mat-slide-toggle
            [checked]="theme.isDark()"
            (change)="theme.toggle()"
          ></mat-slide-toggle>
          <span class="dark-mode-label">Modo Escuro</span>
        </button>

        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Sair</span>
        </button>
      </mat-menu>
    </div>
  }
</mat-toolbar>

<mat-sidenav-container>
  <mat-sidenav
    class="sidebar"
    opened
    mode="side"
    [style.width]="sidebarWidth()"
  >
    <app-sidebar [collapsed]="collapsed()" />
  </mat-sidenav>

  <mat-sidenav-content class="content" [style.margin-left]="sidebarWidth()">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
