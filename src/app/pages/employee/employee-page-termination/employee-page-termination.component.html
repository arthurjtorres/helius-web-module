<h2 mat-dialog-title>Desligar funcionário {{ data.registration }}</h2>
<mat-dialog-content>
  <p>{{ data.fullName }}: o usuário vinculado também será desativado e perderá as permissões.</p>
  <mat-form-field appearance="outline">
    <mat-label>Data de rescisão</mat-label>
    <input matInput type="date" name="terminationDate" required [min]="minDate" [max]="maxDate" [(ngModel)]="terminationDate" #date="ngModel" />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button color="warn" [mat-dialog-close]="terminationDate" [disabled]="date.invalid">Desligar</button>
</mat-dialog-actions>
