<ng-container class="vehicle-container">
  <header class="vehicle-header">
    <mat-form-field appearance="outline">
      <mat-label>Usuário</mat-label>
      <mat-select [value]="userId" (selectionChange)="selectUser($event.value)">
        @for (u of users; track u.userId) { <mat-option [value]="u.userId">{{ u.userName }} ({{ u.email }})</mat-option> }
      </mat-select>
    </mat-form-field>
    @if (userId) {
      <app-company-select [(ngModel)]="companyId" hint="Empresa do mesmo grupo do funcionário"></app-company-select>
      <button mat-fab extended class="button-import" [disabled]="!companyId" (click)="grant()">
        <mat-icon>add_circle_outline</mat-icon>Conceder
      </button>
    }
  </header>
  <mat-divider></mat-divider>

  <div class="table-container">
    <mat-table class="mat-elevation-z8" [dataSource]="dataSource">
      <ng-container matColumnDef="company">
        <mat-header-cell *matHeaderCellDef class="type">Empresa concedida</mat-header-cell>
        <mat-cell *matCellDef="let item" class="type">{{ companyName(item.fkCompanyId) }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef class="actions">Ações</mat-header-cell>
        <mat-cell *matCellDef="let item" class="actions">
          <button mat-icon-button color="warn" matTooltip="Retirar" aria-label="Retirar" (click)="revoke(item)">
            <mat-icon>delete</mat-icon>
          </button>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="columns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: columns"></mat-row>
    </mat-table>
  </div>
</ng-container>
