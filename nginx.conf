server {
  listen 80;
  root /usr/share/nginx/html;

  # No nível server, para valer em todas as respostas: um add_header dentro de um location anularia estes
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # SPA com rotas por caminho: qualquer rota sem arquivo devolve o index.html (F5 em /home/...)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
