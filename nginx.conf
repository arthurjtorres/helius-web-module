server {
  listen 80;
  root /usr/share/nginx/html;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # SPA com rotas por caminho: qualquer rota sem arquivo devolve o index.html (F5 em /home/...)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
